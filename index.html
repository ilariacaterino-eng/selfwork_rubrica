<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubrica di Ovetta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geo:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="container">
        <div class="row">
            <div class="col-12">
                <div class="borderCustom mt-3 lg:mt-5 custombox-shadow">
                    <h1 class="text-center customtext-shadow mt-2 mb-2">Rubrica di Ovetta</h1>
                </div>
            </div>
        </div>
    </header>  
    
    <!-- Buttons e forms container -->
    <div class="container-fluid mt-4">
        <div class="row align-items-start">
            
            <!-- Mostra contatti -->
            <div class="col-12 col-md-4 d-flex justify-content-center mb-3 mt-md-3">
                <button id="showContactBtn" class="btn w-50 w-md-75 btn-custom custombox-shadow customtext-shadow">Mostra contatti</button>
            </div>
            
            <!-- Input aggiungi contatto -->
            <div class="col-12 col-md-4 mb-3 d-flex flex-column align-items-center justify-content-center mt-md-3">
                <button class="btn w-50 w-md-75 btn-custom custombox-shadow customtext-shadow" type="button" data-bs-toggle="collapse" data-bs-target="#aggiungiContattoForm" aria-expanded="false" aria-controls="aggiungiContattoForm">
                    Aggiungi contatto
                </button>
                <div class="collapse w-75 mt-3" id="aggiungiContattoForm">
                    <div class="card card-body bg-transparent borderCustom p-3 custombox-shadow">
                        <input type="text" id="nameInput" class="form-control mb-2 fw-medium fw-bold" placeholder="Inserisci nome">
                        <input type="number" id="phoneInput" class="form-control mb-3 fw-bold" placeholder="Inserisci numero">
                        <button id="saveContactBtn" class="btn btn-custom w-100 p-0">Salva</button>
                    </div>
                </div>
            </div>
            
            <!-- Cerca contatto -->
            <div class="col-12 col-md-4 d-flex justify-content-center mb-3 mt-md-3 flex-column align-items-center">
                <button class="btn w-50 w-md-75 btn-custom custombox-shadow customtext-shadow" type="button" data-bs-toggle="collapse" data-bs-target="#cercaContattoForm" aria-expanded="false" aria-controls="cercaContattoForm">
                    Cerca contatto
                </button>
                <div class="collapse w-75 mt-3" id="cercaContattoForm">
                    <div class="card card-body bg-transparent borderCustom p-3 custombox-shadow">
                        <input type="text" id="searchInput" class="form-control fw-bold mb-2" placeholder="Cerca per nome...">
                        <button id="searchContactBtn" class="btn btn-custom w-100 p-0">cerca</button>
                    </div>
                </div>
            </div>

            

        </div>
    </div> 

    <!-- Card Wrapper  -->
    <section class="container mt-2 mt-md-5">
        <div class="row d-flex justify-content-center">
            <div id="contactWrapper" class="col-12 col-md-8 p-3">
                <!-- contatti dinamici -->
            </div>
        </div>
    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/c763ff2d7a.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
